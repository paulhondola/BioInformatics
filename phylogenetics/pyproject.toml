[project]
name = "phylogenetics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Hondola", email = "paulhondola@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.84",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
phylogenetics = "phylogenetics:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
