[project]
name = "phylogenetics"
version = "0.1.0"
description = "Phylogenetics assignment (Lab 04): TP53 CDS distance matrix, NJ tree and Clustal Omega comparison"
readme = "README.txt"
authors = [
    { name = "Paul Hondola", email = "paulhondola@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "biopython>=1.84",
    "matplotlib>=3.9",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.3",
]

[project.scripts]
phylogenetics = "phylogenetics.__main__:main"

[tool.uv.build-backend]
module-name = "phylogenetics"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
